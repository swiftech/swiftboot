swiftboot:
  auth:
    authType: session
    passwordSalt: 74b62b0ae8dfca1d88d8a41bd
    session:
      type: redis
      group: user_session
      expiresIn: 1800
      updateExpireTime: true
      useCookie: true
      cookiePath: /
  web:
    rate-limit:
      rules:
        - uri: /rate_limit/user/cfg
          time: 1000
          count: 1
          limit-type: DEFAULT
        - uri: /rate_limit/global/cfg
          time: 1000
          count: 1
          limit-type: USER